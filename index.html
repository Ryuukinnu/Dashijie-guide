<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>散场以后｜环人广观剧指南</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fafafa;color:#292929;font-family:"Microsoft YaHei",sans-serif}
header{background:white;border-bottom:1px solid #eee;padding:20px 6%;font-size:22px;font-weight:bold}
header span{color:#df4361}
main{max-width:1150px;margin:auto;padding:36px 22px}
.eyebrow{color:#df4361}
h1{font-size:clamp(28px,5vw,44px);margin:14px 0}
.intro,.muted{color:#707070;line-height:1.8}
.controls{margin:28px 0}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
button,input{font:inherit}
button{cursor:pointer}
.tabs button,.more{border:1px solid #ddd;background:white;border-radius:24px;padding:11px 19px;color:#444}
.tabs button.active{background:#df4361;color:white;border-color:#df4361}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #333;outline-offset:3px}
input{width:100%;padding:15px 18px;border:1px solid #ddd;border-radius:12px;background:white}
.summary{margin:20px 0;color:#666}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{border:1px solid #eee;background:white;border-radius:18px;padding:22px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;color:inherit;min-height:190px}
.card:hover{border-color:#df4361;box-shadow:0 6px 22px #00000008}
.tag{font-size:14px;color:#b92d48;background:#fff0f3;border-radius:6px;padding:5px 9px}
.card h2{font-size:19px;line-height:1.5;margin:15px 0 10px}
.card p{font-size:15px;color:#777;line-height:1.7;margin:0}
.detail-link{color:#c93150;font-size:14px;margin-top:auto;padding-top:18px}
.empty{padding:35px;background:white;border-radius:16px;line-height:1.8}
.more{display:block;margin:28px auto}
footer{margin:35px 0;color:#777;font-size:14px;line-height:1.9}
dialog{width:min(600px,92vw);border:0;border-radius:20px;padding:28px;max-height:85vh;overflow:auto}
dialog::backdrop{background:#0007}
.close{float:right;border:0;background:#f1f1f1;border-radius:50%;width:36px;height:36px;font-size:22px}
dialog h2{padding-right:40px;line-height:1.5}
dl{line-height:1.8}
dt{font-weight:bold;margin-top:16px}
dd{margin:4px 0;color:#666;overflow-wrap:anywhere}
.navlink{display:inline-block;background:#df4361;color:white;text-decoration:none;padding:12px 20px;border-radius:10px;margin-top:14px}
.related{display:block;width:100%;text-align:left;padding:13px 0;border:0;border-bottom:1px solid #eee;background:white;line-height:1.6;color:#444}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:500px){main{padding:28px 16px}.grid{gap:10px}.card{padding:15px;min-height:210px}.card h2{font-size:17px}.tabs{gap:8px}.tabs button{padding:10px 14px}}
</style>
</head>
<body>
<header><span>散场以后</span> · 环人广观剧指南</header>
<main>
<div class="eyebrow">上海 · 演艺新空间周边</div>
<h1>一场好戏，一份周边指南</h1>
<p class="intro">找一顿演前饭、一束花，或一个跨城观剧的落脚处。</p>

<div class="controls">
<div class="tabs" id="areas" aria-label="观剧区域">
<button data-area="大世界" class="active" aria-pressed="true">大世界</button>
<button data-area="亚洲大厦" aria-pressed="false">亚洲大厦</button>
<button data-area="第一百货" aria-pressed="false">第一百货</button>
</div>
<div class="tabs" id="categories" aria-label="店铺类别">
<button data-category="全部" class="active" aria-pressed="true">全部</button>
<button data-category="餐饮" aria-pressed="false">餐饮</button>
<button data-category="花店" aria-pressed="false">花店</button>
<button data-category="便利店" aria-pressed="false">便利店</button>
<button data-category="住宿" aria-pressed="false">住宿</button>
</div>
<input id="search" type="search" placeholder="搜索店名、地址或餐饮类型" aria-label="搜索店铺">
</div>

<p id="summary" class="summary" role="status">正在读取店铺数据……</p>
<div id="list" class="grid"></div>
<button id="more" class="more" hidden>再看一些店铺</button>

<footer>
目前接入大世界数据，其他区域陆续补充。<br>
数据来自用户提供的高德POI采集结果，尚未逐店核验。营业状态、价格和营业时间以商家实际信息为准。<br>
地图与步行距离将在核对坐标后接入。
</footer>
</main>

<dialog id="detail" aria-labelledby="detail-title">
<button class="close" id="close" aria-label="关闭详情">×</button>
<h2 id="detail-title"></h2>
<div id="detail-body"></div>
</dialog>

<script>
let shops=[];
let area="大世界";
let category="全部";
let limit=24;
let loaded=false;
let failed=false;

const list=document.getElementById("list");
const summary=document.getElementById("summary");
const more=document.getElementById("more");
const search=document.getElementById("search");
const dialog=document.getElementById("detail");

function element(tag,text,className){
  const node=document.createElement(tag);
  if(text!==undefined) node.textContent=text;
  if(className) node.className=className;
  return node;
}

function filtered(){
  const query=search.value.trim().toLowerCase();
  return shops.filter(shop=>{
    const p=shop.properties;
    return (category==="全部"||p.category===category)
      && [p.name,p.address,p.originalType].join(" ").toLowerCase().includes(query);
  });
}

function render(){
  list.replaceChildren();
  more.hidden=true;

  if(area!=="大世界"){
    summary.textContent=area+"周边数据待接入";
    list.append(element("p","这个区域的店铺尚未录入，可以先切回大世界浏览。","empty"));
    return;
  }
  if(failed){
    summary.textContent="数据读取失败";
    list.append(element("p","请确认 dashijie-shops.geojson 与 index.html 在仓库同一层，然后刷新页面。","empty"));
    return;
  }
  if(!loaded){
    summary.textContent="正在读取店铺数据……";
    return;
  }

  const results=filtered();
  summary.textContent="大世界 · "+category+" · 找到 "+results.length+" 家，已显示 "+Math.min(limit,results.length)+" 家";

  if(!results.length){
    list.append(element("p","没有找到匹配店铺，试试更短的关键词或其他类别。","empty"));
  }

  results.slice(0,limit).forEach(shop=>{
    const p=shop.properties;
    const card=element("button",undefined,"card");
    card.type="button";
    card.append(
      element("span",p.category,"tag"),
      element("h2",p.name),
      element("p",p.address||"地址待补充"),
      element("span","查看店铺详情","detail-link")
    );
    card.addEventListener("click",()=>openDetail(shop));
    list.append(card);
  });
  more.hidden=results.length<=limit;
}

function openDetail(shop){
  const p=shop.properties;
  document.getElementById("detail-title").textContent=p.name;
  const body=document.getElementById("detail-body");
  body.replaceChildren();

  const dl=element("dl");
  [
    ["类别",p.category],
    ["详细类型",p.originalType||"待补充"],
    ["地址",p.address||"待补充"],
    ["营业时间",p.openingHours||"暂未收录，请向商家确认"],
    ["价格信息",p.price==null?"暂未收录":String(p.price)]
  ].forEach(([label,value])=>{
    dl.append(element("dt",label),element("dd",value));
  });
  body.append(dl);

  const link=element("a","在高德地图搜索店铺","navlink");
  link.href="https://uri.amap.com/search?keyword="+
    encodeURIComponent(p.name+" "+(p.address||""))+
    "&city=上海&view=map";
  link.target="_blank";
  link.rel="noopener noreferrer";
  body.append(link);

  body.append(element("h3","同类店铺，也可以看看"));
  body.append(element("p","按同类数据顺序展示，尚未按距离或口碑排序。","muted"));

  shops.filter(item=>item.properties.category===p.category
    &&item.properties.id!==p.id).slice(0,3).forEach(item=>{
      const button=element("button",item.properties.name,"related");
      button.type="button";
      button.addEventListener("click",()=>openDetail(item));
      body.append(button);
    });

  if(!dialog.open) dialog.showModal();
  dialog.scrollTop=0;
}

document.querySelectorAll("[data-area]").forEach(button=>{
  button.addEventListener("click",()=>{
    area=button.dataset.area;
    limit=24;
    document.querySelectorAll("[data-area]").forEach(item=>{
      const active=item===button;
      item.classList.toggle("active",active);
      item.setAttribute("aria-pressed",String(active));
    });
    render();
  });
});

document.querySelectorAll("[data-category]").forEach(button=>{
  button.addEventListener("click",()=>{
    category=button.dataset.category;
    limit=24;
    document.querySelectorAll("[data-category]").forEach(item=>{
      const active=item===button;
      item.classList.toggle("active",active);
      item.setAttribute("aria-pressed",String(active));
    });
    render();
  });
});

search.addEventListener("input",()=>{limit=24;render()});
more.addEventListener("click",()=>{limit+=24;render()});
document.getElementById("close").addEventListener("click",()=>dialog.close());

async function load(){
  try{
    const response=await fetch("./dashijie-shops.geojson");
    if(!response.ok) throw new Error("读取失败");
    const data=await response.json();
    if(!Array.isArray(data.features)) throw new Error("格式错误");
    shops=data.features.filter(item=>item.properties&&item.properties.name);
    loaded=true;
  }catch(error){
    failed=true;
  }
  render();
}
load();
</script>
<!-- 周边店铺地图 -->
<script src="https://webapi.amap.com/loader.js"></script>
<script>
window._AMapSecurityConfig = {
  securityJsCode: "7e10633c69c9e2f1e0036ef6a3609b70"
};

const mapSection = document.createElement("section");
mapSection.style.margin = "24px 0";
mapSection.innerHTML = `
  <h2>周边地图</h2>
  <p id="map-status" class="muted" role="status">
    正在加载地图……
  </p>
  <div id="shop-map"
       aria-label="周边店铺地图"
       style="height:440px;width:100%;border-radius:18px;
              overflow:hidden;background:#eee"></div>
`;
document.querySelector(".controls").after(mapSection);

let guideMap;
let guideAMap;
let guideMarkers = [];

function updateGuideMap() {
  if (!guideMap || !guideAMap) return;

  guideMap.remove(guideMarkers);
  guideMarkers = [];

  const status = document.getElementById("map-status");

  if (area !== "大世界") {
    status.textContent = area + "数据待接入，请先切回大世界。";
    return;
  }

  if (failed) {
    status.textContent = "店铺数据读取失败，请刷新页面。";
    return;
  }

  if (!loaded) {
    status.textContent = "地图已加载，正在等待店铺数据……";
    return;
  }

  const results = filtered();

  // 与列表一致，只展示当前已显示的店铺，避免点位过于密集。
  results.slice(0, limit).forEach(shop => {
    const coordinates = shop.geometry?.coordinates;
    if (!Array.isArray(coordinates)) return;

    const longitude = Number(coordinates[0]);
    const latitude = Number(coordinates[1]);
    if (!Number.isFinite(longitude) ||
        !Number.isFinite(latitude)) return;

    const marker = new guideAMap.Marker({
      position: [longitude, latitude],
      title: shop.properties.name
    });

    marker.on("click", () => openDetail(shop));
    guideMarkers.push(marker);
  });

  guideMap.add(guideMarkers);

  if (guideMarkers.length) {
    guideMap.setFitView(guideMarkers);
  }

  status.textContent =
    "地图展示当前列表中的 " + guideMarkers.length +
    " 家店铺，点击标记查看详情。坐标位置待实地核对。";
}

// 每次搜索、切换类别或加载更多时，同步更新地图。
const renderWithoutMap = render;
render = function () {
  renderWithoutMap();
  updateGuideMap();
};

AMapLoader.load({
  key: "565a133f9f77facadae1c9cc99f37916",
  version: "2.0",
  plugins: ["AMap.Scale", "AMap.ToolBar"]
}).then(AMap => {
  guideAMap = AMap;
  guideMap = new AMap.Map("shop-map", {
    zoom: 14,
    center: [121.48, 31.23],
    viewMode: "2D"
  });

  guideMap.addControl(new AMap.Scale());
  guideMap.addControl(new AMap.ToolBar());
  // 大世界步行服务区
fetch("./dashijie-service-areas-amap.json")
  .then(response => {
    if (!response.ok) throw new Error("服务区文件读取失败");
    return response.json();
  })
  .then(data => {
    let servicePolygons = [];

    const panel = document.createElement("div");
    panel.style.margin = "20px 0";

    const title = document.createElement("p");
    title.textContent = "从大世界入口出发的步行距离范围";
    title.style.fontWeight = "bold";

    const controls = document.createElement("div");
    controls.className = "tabs";

    const note = document.createElement("p");
    note.className = "muted";
    note.textContent =
      "按GIS步行路网分析生成，为累计距离范围，并非直线半径或步行分钟数。";

    panel.append(title, controls, note);
    document.getElementById("shop-map").after(panel);

    function clearServiceArea() {
      guideMap.remove(servicePolygons);
      servicePolygons = [];
    }

    [0, 300, 500, 1000].forEach(distance => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = distance === 0
        ? "隐藏范围"
        : distance + "米";
      button.setAttribute(
        "aria-pressed",
        String(distance === 0)
      );
      if (distance === 0) button.classList.add("active");

      button.addEventListener("click", () => {
        clearServiceArea();

        controls.querySelectorAll("button").forEach(item => {
          const selected = item === button;
          item.classList.toggle("active", selected);
          item.setAttribute("aria-pressed", String(selected));
        });

        if (distance === 0) return;

        if (area !== "大世界") {
          note.textContent = "请先切回大世界，再查看步行范围。";
          return;
        }

        const features = data.features.filter(feature =>
          Number(feature.properties.ToBreak) === distance
        );

        features.forEach(feature => {
          const geometry = feature.geometry;
          const paths = geometry.type === "Polygon"
            ? [geometry.coordinates]
            : geometry.type === "MultiPolygon"
              ? geometry.coordinates
              : [];

          paths.forEach(path => {
            servicePolygons.push(new AMap.Polygon({
              path,
              strokeColor: "#3285ad",
              strokeWeight: 2,
              fillColor: "#51b5dc",
              fillOpacity: 0.18,
              zIndex: 10,
              bubble: true
            }));
          });
        });

        guideMap.add(servicePolygons);

        if (servicePolygons.length) {
          guideMap.setFitView(servicePolygons);
          note.textContent =
            distance +
            "米累计步行距离范围。此功能仅展示范围，暂不筛选店铺。";
        } else {
          note.textContent = "没有找到这一距离的服务区数据。";
        }
      });

      controls.append(button);
    });

    // 切到其他区域时，隐藏大世界的服务区
    document.querySelectorAll("[data-area]").forEach(button => {
      button.addEventListener("click", () => {
        clearServiceArea();
        controls.querySelectorAll("button").forEach((item, index) => {
          item.classList.toggle("active", index === 0);
          item.setAttribute("aria-pressed", String(index === 0));
        });
        note.textContent =
          "按GIS步行路网分析生成，为累计距离范围，并非直线半径或步行分钟数。";
      });
    });
  })
  .catch(error => {
    console.error("服务区加载失败：", error);
    const message = document.createElement("p");
    message.className = "muted";
    message.textContent =
      "步行服务区加载失败，请检查服务区文件名及部署状态。";
    document.getElementById("shop-map").after(message);
  });
  // 加载大世界出入口
fetch("./dashijie-entrances-amap.json")
  .then(response => {
    if (!response.ok) throw new Error("入口文件读取失败");
    return response.json();
  })
  .then(data => {
    const entranceMarkers = [];

    data.features.forEach((feature, index) => {
      if (feature.geometry?.type !== "Point") return;

      const name = "大世界出入口" + (index + 1);

      const markerContent = document.createElement("div");
      markerContent.textContent = "入口" + (index + 1);
      markerContent.style.cssText = `
        background:#087f5b;
        color:white;
        padding:7px 10px;
        border:2px solid white;
        border-radius:8px;
        font-size:14px;
        white-space:nowrap;
        box-shadow:0 2px 8px #0003;
        cursor:pointer;
      `;

      const marker = new AMap.Marker({
        position: feature.geometry.coordinates,
        content: markerContent,
        anchor: "bottom-center",
        title: name,
        zIndex: 200
      });

      marker.on("click", () => {
        const content = document.createElement("div");
        const title = document.createElement("strong");
        title.textContent = name;

        const note = document.createElement("p");
        note.textContent =
          "用户提供的入口位置，观演用途及开放情况待核实。";

        content.append(title, note);

        new AMap.InfoWindow({
          content,
          offset: new AMap.Pixel(0, -35)
        }).open(guideMap, feature.geometry.coordinates);
      });

      entranceMarkers.push(marker);
    });

    guideMap.add(entranceMarkers);

    const button = document.createElement("button");
    button.textContent = "查看大世界出入口";
    button.className = "more";
    button.type = "button";

    button.addEventListener("click", () => {
      if (entranceMarkers.length) {
        guideMap.setFitView(entranceMarkers);
      }
    });

    document.getElementById("shop-map").after(button);
  })
  .catch(error => {
    console.error("入口加载失败：", error);
    const message = document.createElement("p");
    message.className = "muted";
    message.textContent =
      "入口加载失败，请检查 dashijie-entrances-amap.json 文件。";
    document.getElementById("shop-map").after(message);
  });
  // 读取大世界建筑轮廓
fetch("./dashijie-building-amap.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("建筑文件读取失败");
    }
    return response.json();
  })
  .then(data => {
    const buildingPolygons = [];

    data.features.forEach(feature => {
      if (feature.geometry.type !== "Polygon") return;

      const polygon = new AMap.Polygon({
        path: feature.geometry.coordinates,
        strokeColor: "#df4361",
        strokeWeight: 3,
        fillColor: "#df4361",
        fillOpacity: 0.25,
        zIndex: 40
      });

      buildingPolygons.push(polygon);
    });

    guideMap.add(buildingPolygons);

    // 增加一个按钮，方便随时找到大世界
    const locateButton = document.createElement("button");
    locateButton.textContent = "查看大世界建筑";
    locateButton.className = "more";
    locateButton.type = "button";

    locateButton.addEventListener("click", () => {
      if (buildingPolygons.length) {
        guideMap.setFitView(buildingPolygons);
      }
    });

    document.getElementById("shop-map").after(locateButton);
  })
  .catch(error => {
    console.error("建筑轮廓加载失败：", error);

    const message = document.createElement("p");
    message.className = "muted";
    message.textContent =
      "建筑轮廓加载失败，请检查仓库中的文件名。";
    document.getElementById("shop-map").after(message);
  });
  updateGuideMap();
}).catch(error => {
  document.getElementById("map-status").textContent =
    "地图加载失败，请检查Key、安全密钥及域名设置。店铺列表仍可使用。";
  console.error("地图加载失败：", error);
});
</script>
</body>
</html>
