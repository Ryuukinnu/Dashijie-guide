<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>散场以后｜环人广观剧指南</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fafafa;color:#292929;font-family:"Microsoft YaHei",sans-serif}
header{background:white;border-bottom:1px solid #eee;padding:20px 6%;font-size:22px;font-weight:bold}
header span{color:#df4361}
main{max-width:1150px;margin:auto;padding:36px 22px}
.eyebrow{color:#df4361}
h1{font-size:clamp(28px,5vw,44px);margin:14px 0}
.intro,.muted{color:#707070;line-height:1.8}
.controls{margin:28px 0}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
button,input{font:inherit}
button{cursor:pointer}
.tabs button,.more{border:1px solid #ddd;background:white;border-radius:24px;padding:11px 19px;color:#444}
.tabs button.active{background:#df4361;color:white;border-color:#df4361}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #333;outline-offset:3px}
input{width:100%;padding:15px 18px;border:1px solid #ddd;border-radius:12px;background:white}
.summary{margin:20px 0;color:#666}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{border:1px solid #eee;background:white;border-radius:18px;padding:22px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;color:inherit;min-height:190px}
.card:hover{border-color:#df4361;box-shadow:0 6px 22px #00000008}
.tag{font-size:14px;color:#b92d48;background:#fff0f3;border-radius:6px;padding:5px 9px}
.card h2{font-size:19px;line-height:1.5;margin:15px 0 10px}
.card p{font-size:15px;color:#777;line-height:1.7;margin:0}
.detail-link{color:#c93150;font-size:14px;margin-top:auto;padding-top:18px}
.empty{padding:35px;background:white;border-radius:16px;line-height:1.8}
.more{display:block;margin:28px auto}
footer{margin:35px 0;color:#777;font-size:14px;line-height:1.9}
dialog{width:min(600px,92vw);border:0;border-radius:20px;padding:28px;max-height:85vh;overflow:auto}
dialog::backdrop{background:#0007}
.close{float:right;border:0;background:#f1f1f1;border-radius:50%;width:36px;height:36px;font-size:22px}
dialog h2{padding-right:40px;line-height:1.5}
dl{line-height:1.8}
dt{font-weight:bold;margin-top:16px}
dd{margin:4px 0;color:#666;overflow-wrap:anywhere}
.navlink{display:inline-block;background:#df4361;color:white;text-decoration:none;padding:12px 20px;border-radius:10px;margin-top:14px}
.related{display:block;width:100%;text-align:left;padding:13px 0;border:0;border-bottom:1px solid #eee;background:white;line-height:1.6;color:#444}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:500px){main{padding:28px 16px}.grid{gap:10px}.card{padding:15px;min-height:210px}.card h2{font-size:17px}.tabs{gap:8px}.tabs button{padding:10px 14px}}
</style>
</head>
<body>
<header><span>散场以后</span> · 环人广观剧指南</header>
<main>
<div class="eyebrow">上海 · 演艺新空间周边</div>
<h1>一场好戏，一份周边指南</h1>
<p class="intro">找一顿演前饭、一束花，或一个跨城观剧的落脚处。</p>

<div class="controls">
<div class="tabs" id="areas" aria-label="观剧区域">
<button data-area="大世界" class="active" aria-pressed="true">大世界</button>
<button data-area="亚洲大厦" aria-pressed="false">亚洲大厦</button>
<button data-area="第一百货" aria-pressed="false">第一百货</button>
</div>
<div class="tabs" id="categories" aria-label="店铺类别">
<button data-category="全部" class="active" aria-pressed="true">全部</button>
<button data-category="餐饮" aria-pressed="false">餐饮</button>
<button data-category="花店" aria-pressed="false">花店</button>
<button data-category="便利店" aria-pressed="false">便利店</button>
<button data-category="住宿" aria-pressed="false">住宿</button>
</div>
<input id="search" type="search" placeholder="搜索店名、地址或餐饮类型" aria-label="搜索店铺">
</div>

<p id="summary" class="summary" role="status">正在读取店铺数据……</p>
<div id="list" class="grid"></div>
<button id="more" class="more" hidden>再看一些店铺</button>

<footer>
目前接入大世界、亚洲大厦和第一百货。<br>
数据来自用户提供的店铺采集资料，尚未逐店核验。营业状态、价格和营业时间以商家实际信息为准。<br>
步行范围来自GIS路网分析；按服务区面筛选，不代表逐店精确步行距离。
</footer>
</main>

<dialog id="detail" aria-labelledby="detail-title">
<button class="close" id="close" aria-label="关闭详情">×</button>
<h2 id="detail-title"></h2>
<div id="detail-body"></div>
</dialog>

<script>
let shops=[];
const regionShops={};
const regionErrors={};
const areaPrefixes={"大世界":"dashijie","亚洲大厦":"asia","第一百货":"firstdept"};
const supportedAreas=Object.keys(areaPrefixes);
let area="大世界";
let category="全部";
let limit=24;
let loaded=false;
let failed=false;

const list=document.getElementById("list");
const summary=document.getElementById("summary");
const more=document.getElementById("more");
const search=document.getElementById("search");
const dialog=document.getElementById("detail");

function element(tag,text,className){
  const node=document.createElement(tag);
  if(text!==undefined) node.textContent=text;
  if(className) node.className=className;
  return node;
}

let walkingDistance = 0;
let walkingFeatures = [];

function ringContains(point, ring) {
  const [x,y] = point;
  let inside = false;
  for (let i=0,j=ring.length-1;i<ring.length;j=i++) {
    const [ax,ay]=ring[j], [bx,by]=ring[i];
    const cross=(x-ax)*(by-ay)-(y-ay)*(bx-ax);
    if (Math.abs(cross)<1e-12 && x>=Math.min(ax,bx)-1e-12 && x<=Math.max(ax,bx)+1e-12
        && y>=Math.min(ay,by)-1e-12 && y<=Math.max(ay,by)+1e-12) return true;
    if ((ay>y)!==(by>y) && x<(bx-ax)*(y-ay)/(by-ay)+ax) inside=!inside;
  }
  return inside;
}
function polygonContains(point, rings) {
  return rings.length>0 && ringContains(point,rings[0])
    && !rings.slice(1).some(ring=>ringContains(point,ring));
}
function withinWalkingArea(shop) {
  if (!walkingDistance) return true;
  const point=shop.geometry?.coordinates;
  if (shop.geometry?.type!=="Point" || !Array.isArray(point)
      || !point.slice(0,2).every(Number.isFinite)) return false;
  return walkingFeatures.some(feature=>{
    const g=feature.geometry;
    return g.type==="Polygon" ? polygonContains(point,g.coordinates)
      : g.type==="MultiPolygon" && g.coordinates.some(rings=>polygonContains(point,rings));
  });
}

function filtered(){
  const query=search.value.trim().toLowerCase();
  return shops.filter(shop=>{
    const p=shop.properties;
    return shop.properties.area===area && withinWalkingArea(shop) && (category==="全部"||p.category===category)
      && [p.name,p.address,p.originalType].join(" ").toLowerCase().includes(query);
  });
}

function render(){
  list.replaceChildren();
  more.hidden=true;

  if(!supportedAreas.includes(area)){
    summary.textContent=area+"周边数据待接入";
    list.append(element("p","这个区域的店铺尚未录入，可以先切回大世界浏览。","empty"));
    return;
  }
  if(regionErrors[area]){
    summary.textContent="数据读取失败";
    list.append(element("p","请确认当前区域的店铺数据文件与 index.html 在仓库同一层，然后刷新页面。","empty"));
    return;
  }
  if(!loaded){
    summary.textContent="正在读取店铺数据……";
    return;
  }

  const results=filtered();
  summary.textContent=area+" · "+(walkingDistance ? walkingDistance+"米服务区内 · " : "")+category+" · 找到 "+results.length+" 家，已显示 "+Math.min(limit,results.length)+" 家";

  if(!results.length){
    list.append(element("p","没有找到匹配店铺，试试更短的关键词或其他类别。","empty"));
  }

  results.slice(0,limit).forEach(shop=>{
    const p=shop.properties;
    const card=element("button",undefined,"card");
    card.type="button";
    card.append(
      element("span",p.category,"tag"),
      element("h2",p.name),
      element("p",p.address||"地址待补充"),
      element("span","查看店铺详情","detail-link")
    );
    card.addEventListener("click",()=>openDetail(shop));
    list.append(card);
  });
  more.hidden=results.length<=limit;
}

function openDetail(shop){
  const p=shop.properties;
  document.getElementById("detail-title").textContent=p.name;
  const body=document.getElementById("detail-body");
  body.replaceChildren();

  const dl=element("dl");
  [
    ["类别",p.category],
    ["详细类型",p.originalType||"待补充"],
    ["地址",p.address||"待补充"],
    ["营业时间",p.openingHours||"暂未收录，请向商家确认"],
    ["价格信息（原表，供参考）",p.price==null?"暂未收录":String(p.price)],
    ["核验备注",p.verificationNote||"尚未逐店核验，营业情况请向商家确认"]
  ].forEach(([label,value])=>{
    dl.append(element("dt",label),element("dd",value));
  });
  body.append(dl);

  const link=element("a","在高德地图搜索店铺","navlink");
  link.href="https://uri.amap.com/search?keyword="+
    encodeURIComponent(p.name+" "+(p.address||""))+
    "&city=上海&view=map";
  link.target="_blank";
  link.rel="noopener noreferrer";
  body.append(link);

  body.append(element("h3","同类店铺，也可以看看"));
  body.append(element("p","按同类数据顺序展示，尚未按距离或口碑排序。","muted"));

  shops.filter(item=>item.properties.area===area && withinWalkingArea(item) && item.properties.category===p.category
    &&item.properties.id!==p.id).slice(0,3).forEach(item=>{
      const button=element("button",item.properties.name,"related");
      button.type="button";
      button.addEventListener("click",()=>openDetail(item));
      body.append(button);
    });

  if(!dialog.open) dialog.showModal();
  dialog.scrollTop=0;
}

document.querySelectorAll("[data-area]").forEach(button=>{
  button.addEventListener("click",()=>{
    area=button.dataset.area;
    walkingDistance=0;walkingFeatures=[];
    limit=24;
    document.querySelectorAll("[data-area]").forEach(item=>{
      const active=item===button;
      item.classList.toggle("active",active);
      item.setAttribute("aria-pressed",String(active));
    });
    render();
  });
});

document.querySelectorAll("[data-category]").forEach(button=>{
  button.addEventListener("click",()=>{
    category=button.dataset.category;
    limit=24;
    document.querySelectorAll("[data-category]").forEach(item=>{
      const active=item===button;
      item.classList.toggle("active",active);
      item.setAttribute("aria-pressed",String(active));
    });
    render();
  });
});

search.addEventListener("input",()=>{limit=24;render()});
more.addEventListener("click",()=>{limit+=24;render()});
document.getElementById("close").addEventListener("click",()=>dialog.close());

async function load(){
  await Promise.all(supportedAreas.map(async name=>{
    try {
      const file=areaPrefixes[name]+"-shops.geojson";
      const response=await fetch("./"+file);
      if(!response.ok) throw Error(file);
      const data=await response.json();
      if(!Array.isArray(data.features)) throw Error("格式错误");
      regionShops[name]=data.features.filter(f=>f.properties?.name).map(f=>({...f,properties:{...f.properties,area:name}}));
    } catch(error) {regionErrors[name]=true;regionShops[name]=[];}
  }));
  shops=Object.values(regionShops).flat();loaded=true;render();
}
load();
</script>
<!-- 周边店铺地图 -->
<script src="https://webapi.amap.com/loader.js"></script>
<script>
window._AMapSecurityConfig={securityJsCode:"7e10633c69c9e2f1e0036ef6a3609b70"};
const mapSection=element("section");mapSection.style.margin="24px 0";
mapSection.innerHTML='<h2>周边地图</h2><p id="map-status" class="muted" role="status">正在加载地图……</p><div id="shop-map" aria-label="周边店铺地图" style="height:440px;width:100%;border-radius:18px;overflow:hidden;background:#eee"></div>';
document.querySelector(".controls").after(mapSection);
const mapButtons=element("div",undefined,"tabs");mapButtons.style.marginTop="18px";
const buildingButton=element("button","查看建筑","more"),entranceButton=element("button","查看出入口","more");
for(const b of [buildingButton,entranceButton]){b.type="button";b.style.margin="0";mapButtons.append(b);}mapSection.append(mapButtons);
const panel=element("div");panel.style.margin="20px 0";
const walkingTitle=element("p"),walkingControls=element("div",undefined,"tabs"),walkingNote=element("p",undefined,"muted");
walkingTitle.style.fontWeight="bold";panel.append(walkingTitle,walkingControls,walkingNote);mapSection.append(panel);
let guideMap,guideAMap,guideMarkers=[],siteOverlays=[],buildingOverlays=[],entranceOverlays=[],serviceOverlays=[],overlayArea=null;
const spatialData={};
function polygonOverlays(features,style){
  return features.flatMap(f=>{
    const g=f.geometry,paths=g.type==="Polygon"?[g.coordinates]:g.type==="MultiPolygon"?g.coordinates:[];
    return paths.map(path=>new guideAMap.Polygon({path,...style}));
  });
}
function updateSiteOverlays(){
  if(!guideMap)return;
  if(overlayArea===area)return;
  guideMap.remove([...siteOverlays,...serviceOverlays]);siteOverlays=[];serviceOverlays=[];buildingOverlays=[];entranceOverlays=[];
  overlayArea=area;
  const data=spatialData[area];
  walkingTitle.textContent="从"+area+"入口出发的步行距离范围";
  buildingButton.textContent="查看"+area+"建筑";entranceButton.textContent="查看"+area+"出入口";
  buildingButton.disabled=!data?.building;entranceButton.disabled=!data?.entrances;
  walkingControls.querySelectorAll("button").forEach(b=>{b.disabled=Number(b.dataset.distance)>0&&!data?.service;b.classList.toggle("active",Number(b.dataset.distance)===0);b.setAttribute("aria-pressed",String(Number(b.dataset.distance)===0));});
  walkingNote.textContent=supportedAreas.includes(area)?(data?.service?"选择步行距离，可同步筛选地图和列表。按服务区面筛选，逐店步行距离以实际路线为准。":"步行范围正在加载；若加载失败，请检查服务区文件是否上传。"):"该区域数据待接入。";
  if(!data)return;
  buildingOverlays=polygonOverlays(data.building?.features||[],{strokeColor:"#df4361",strokeWeight:3,fillColor:"#df4361",fillOpacity:0.25,zIndex:40});
  entranceOverlays=(data.entrances?.features||[]).filter(f=>f.geometry.type==="Point").map((f,i)=>{
    const label=element("div","入口"+(i+1));label.style.cssText="background:#087f5b;color:white;padding:7px 10px;border:2px solid white;border-radius:8px;white-space:nowrap;box-shadow:0 2px 8px #0003";
    const marker=new guideAMap.Marker({position:f.geometry.coordinates,content:label,anchor:"bottom-center",title:area+"入口"+(i+1),zIndex:200});
    const name=area;
    marker.on("click",()=>{const content=element("div");content.append(element("strong",name+"入口"+(i+1)),element("p","用户提供的入口位置，观演用途及开放情况待核实。"));new guideAMap.InfoWindow({content,offset:new guideAMap.Pixel(0,-35)}).open(guideMap,f.geometry.coordinates);});return marker;
  });
  siteOverlays=[...buildingOverlays,...entranceOverlays];guideMap.add(siteOverlays);
}
function updateGuideMap(){
  if(!guideMap)return;
  updateSiteOverlays();guideMap.remove(guideMarkers);guideMarkers=[];
  const status=document.getElementById("map-status");
  if(!supportedAreas.includes(area)){status.textContent=area+"数据待接入。";return;}
  if(regionErrors[area]){status.textContent=area+"店铺数据读取失败，请检查文件是否上传。";return;}
  if(!loaded){status.textContent="正在读取店铺数据……";return;}
  filtered().slice(0,limit).forEach(shop=>{
    const coords=shop.geometry?.coordinates;
    if(shop.geometry?.type!=="Point"||!Array.isArray(coords)||!coords.every(Number.isFinite))return;
    const marker=new guideAMap.Marker({position:coords,title:shop.properties.name});marker.on("click",()=>openDetail(shop));guideMarkers.push(marker);
  });
  guideMap.add(guideMarkers);
  if(!walkingDistance&&guideMarkers.length)guideMap.setFitView(guideMarkers);
  status.textContent=area+" · 地图展示当前列表中的 "+guideMarkers.length+" 家店铺，点击标记查看详情。坐标位置待实地核对。";
}
for(const distance of [0,300,500,1000]){
  const button=element("button",distance?distance+"米":"隐藏范围");button.type="button";button.dataset.distance=String(distance);walkingControls.append(button);
  button.addEventListener("click",()=>{
    if(!guideMap)return;
    const features=distance?(spatialData[area]?.service?.features||[]).filter(f=>Number(f.properties.ToBreak)===distance):[];
    if(distance&&!features.length){walkingNote.textContent="这一距离的服务区尚未加载成功。";return;}
    guideMap.remove(serviceOverlays);serviceOverlays=[];walkingDistance=distance;walkingFeatures=features;limit=24;render();
    serviceOverlays=polygonOverlays(features,{strokeColor:"#3285ad",strokeWeight:2,fillColor:"#51b5dc",fillOpacity:0.18,zIndex:10,bubble:true});guideMap.add(serviceOverlays);
    walkingControls.querySelectorAll("button").forEach(b=>{b.classList.toggle("active",b===button);b.setAttribute("aria-pressed",String(b===button));});
    walkingNote.textContent=distance?distance+"米累计步行服务区内找到 "+filtered().length+" 家匹配店铺。按服务区面筛选，逐店步行距离以实际路线为准。":"已取消距离筛选，显示符合类别和搜索条件的全部店铺。";
    if(serviceOverlays.length)guideMap.setFitView(serviceOverlays);
  });
}
buildingButton.addEventListener("click",()=>{if(buildingOverlays.length)guideMap.setFitView(buildingOverlays);});
entranceButton.addEventListener("click",()=>{if(entranceOverlays.length)guideMap.setFitView(entranceOverlays);});
const renderWithoutMap=render;render=function(){renderWithoutMap();updateGuideMap();if(walkingDistance)walkingNote.textContent=walkingDistance+"米累计步行服务区内找到 "+filtered().length+" 家匹配店铺。按服务区面筛选，逐店步行距离以实际路线为准。";};
AMapLoader.load({key:"565a133f9f77facadae1c9cc99f37916",version:"2.0",plugins:["AMap.Scale","AMap.ToolBar"]}).then(async AMap=>{
  guideAMap=AMap;guideMap=new AMap.Map("shop-map",{zoom:14,center:[121.48,31.23],viewMode:"2D"});guideMap.addControl(new AMap.Scale());guideMap.addControl(new AMap.ToolBar());updateGuideMap();
  await Promise.all(supportedAreas.map(async name=>{
    const prefix=areaPrefixes[name];spatialData[name]={};
    await Promise.all([["building","building"],["entrances","entrances"],["service","service-areas"]].map(async([kind,suffix])=>{
      try{const response=await fetch("./"+prefix+"-"+suffix+"-amap.json?v=asia1",{cache:"no-cache"});if(!response.ok)throw Error(suffix);const data=await response.json();if(!Array.isArray(data.features))throw Error("格式错误");spatialData[name][kind]=data;}catch(error){console.error(name+suffix+"读取失败",error);}
    }));
    if(area===name){overlayArea=null;updateGuideMap();}
  }));
}).catch(error=>{document.getElementById("map-status").textContent="地图加载失败，请刷新线上网页并检查高德配置。";console.error(error);});
</script>
</body>
</html>
